name: 自动升版并发布 Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '升版类型（patch / minor / major）'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: '指定版本号（留空则按升版类型自动计算，例：1.4.0）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含完整历史与 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 固定 Git 提交身份（罗根）
        run: |
          git config --global user.name "罗根"
          git config --global user.email "2437431045@qq.com"
          echo "提交身份=$(git config --global user.name) <$(git config --global user.email)>"

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存加速
        uses: gradle/actions/setup-gradle@v4

      - name: 还原正式版签名密钥（Secrets，不进代码）
        env:
          KEYSTORE_B64: ${{ secrets.CLOUDMAIL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CLOUDMAIL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLOUDMAIL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLOUDMAIL_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p app/keystore
            echo "$KEYSTORE_B64" | base64 -d > app/keystore/cloudmail-release.keystore
            printf 'storeFile=keystore/cloudmail-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreType=PKCS12\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "签名密钥已就绪"
          else
            echo "未配置签名密钥：本次只产出 Debug APK"
          fi

      - name: 计算并写入新版本号
        id: ver
        run: |
          python3 scripts/bump_version.py --bump "${{ inputs.bump }}" --version "${{ inputs.version }}"

      - name: 提交版本号并推送 main
        run: |
          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "版本号无变化，跳过提交"
          else
            git commit -m "chore(release): v${{ steps.ver.outputs.version }}" -m "自动升版：versionCode ${{ steps.ver.outputs.version_code }}"
            git push origin HEAD:main
          fi

      - name: 打 tag 并推送
        run: |
          git tag -f "v${{ steps.ver.outputs.version }}"
          git push origin "refs/tags/v${{ steps.ver.outputs.version }}" --force

      - name: 编译 APK
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew assembleDebug assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: 收集 APK 产物
        run: |
          mkdir -p apk-out
          find app/build/outputs -name '*.apk' -exec cp -v {} apk-out/ \;
          ls -lh apk-out

      - name: 发布 Release 并挂载 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: apk-out/*.apk

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: CloudMail-APK-v${{ steps.ver.outputs.version }}
          path: apk-out/*.apk
          if-no-files-found: error
