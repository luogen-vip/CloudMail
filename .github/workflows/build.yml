name: Build CloudMail APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 固定 Git 提交身份（罗根）
        run: |
          git config --global user.name "罗根"
          git config --global user.email "2437431045@qq.com"
          git config --global init.defaultBranch main
          echo "提交身份=$(git config --global user.name) <$(git config --global user.email)>"

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存加速
        uses: gradle/actions/setup-gradle@v4

      - name: 还原正式版签名密钥（存于仓库 Secrets，不进代码）
        env:
          KEYSTORE_B64: ${{ secrets.CLOUDMAIL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CLOUDMAIL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLOUDMAIL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLOUDMAIL_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p app/keystore
            echo "$KEYSTORE_B64" | base64 -d > app/keystore/cloudmail-release.keystore
            printf 'storeFile=keystore/cloudmail-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreType=PKCS12\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "签名密钥已就绪：将同时构建 Debug 与已签名的正式版 APK"
          else
            echo "未配置签名密钥：仅构建 Debug APK"
          fi

      - name: 编译 APK
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew assembleDebug assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: 收集 APK 产物
        run: |
          mkdir -p apk-out
          find app/build/outputs -name '*.apk' -exec cp -v {} apk-out/ \;
          ls -lh apk-out

      - name: 上传构建产物（Artifacts：CloudMail-APK）
        uses: actions/upload-artifact@v4
        with:
          name: CloudMail-APK
          path: apk-out/*.apk
          if-no-files-found: error

      - name: 推送 v* 标签时自动发布 Release 并挂载 APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
